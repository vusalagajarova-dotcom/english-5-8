p","qeydiyyatdan keçmək","to put your name on a list to join","Sign up for the school club today."],["fill in","doldurmaq (blank, forma)","to write information in a form","Fill in the form with your name and age."],["clean up","təmizləmək","to make a place tidy and clean","Volunteers clean up the beach every year."],["speak up","ucadan danışmaq","to talk louder","Speak up, please. I cannot hear you."]],R={"1":{"t":"The Origami Club","s":["Last autumn, Leyla joined the origami club at her school.","She has always been keen on making things with her hands.","Every Thursday, the members fold paper into birds, flowers and boats.","Leyla says origami is relaxing and helps her concentration.","It also improves her creativity, because she tries new designs herself.","Next month, the club will attend a small competition in Baku.","Leyla is a little nervous, but she is looking forward to it.","Her dream is to make a perfect paper crane for the final."],"m3":[["When does the club meet?","Every Monday","Every Thursday","Every weekend",2],["What does origami help Leyla with?","Her singing","Her concentration","Her running",3],["Where will the competition take place?","At her school","In Baku","In Ganja",5],["What did Leyla join last autumn?","The origami club","The drawing club","The chess club",0]],"m4":[["What has Leyla always been keen on?","Reading long books","Playing football","Making things with her hands","Cooking dinner",1],["How does Leyla improve her creativity?","She tries new designs herself","She copies her friends","She watches films","She buys new paper",4],["How does Leyla feel about the competition?","Bored","Angry","A little nervous but excited","Sad",6],["What is Leyla's dream?","To win a prize in sport","To make a perfect paper crane","To teach the club","To visit Japan",7]],"tf":[["Leyla joined the club last spring.",0,0],["The members fold boats in the club.",1,2],["Leyla is not nervous at all.",0,6],["Leyla finds origami relaxing.",1,3]]},"2":{"t":"The Food Festival","s":["Last weekend our town held a food festival with cuisine from many countries.","I tried a Mexican taco with crispy shells and juicy chicken.","It had a spicy sauce, so I drank a lot of water!","My friend preferred a mild Italian pizza with cheese and tomato topping.","A chef from Turkey recommended a sweet dessert made with honey and nuts.","We also bought homemade lemonade from a small stand.","The festival was very crowded, but the aroma of the food was wonderful.","I want to go again next year and taste more traditional dishes."],"m3":[["What did the writer try?","A Mexican taco","An Italian pizza","A sweet dessert",1],["Why did the writer drink a lot of water?","The weather was hot","The sauce was spicy","The taco was cold",2],["What did they buy from a small stand?","Homemade lemonade","A milkshake","Fresh bread",5],["What does the writer want to do next year?","Cook at the festival","Go to the festival again","Visit Turkey",7]],"m4":[["What did the town hold last weekend?","A food festival","A book fair","A football match","A music concert",0],["What kind of pizza did the friend prefer?","A spicy one","A mild one","A very large one","A cold one",3],["What did the chef from Turkey recommend?","A sweet dessert with honey and nuts","A hot soup","A fish dish","A fruit salad",4],["What was the festival like?","Quiet and empty","Boring","Very crowded","Rainy",6]],"tf":[["The festival had food from many countries.",1,0],["The friend liked a spicy pizza.",0,3],["The dessert was made with chocolate.",0,4],["The taco sauce was spicy.",1,2]]},"3":{"t":"A Gale on the Coast","s":["Last Friday, the weather forecast warned about a gale on the west coast.","In the morning there was thick fog, so the ferries could not leave the port.","By noon the wind blew at high speed, and some trees fell across the roads.","In the afternoon, a heavy shower caused a small flood in the village centre.","The school was closed, and the children stayed at home.","The local people helped each other and cleaned the streets.","On Saturday the sky was clear, and the weather was mild again.","Everyone felt relieved that nobody was hurt."],"m3":[["What did the weather forecast warn about?","A heavy snowfall","A gale","A drought",0],["Why could the ferries not leave the port?","There was thick fog","There was no fuel","The sea was frozen",1],["What caused the small flood?","A river","A broken pipe","A heavy shower",3],["What was the weather like on Saturday?","Clear and mild","Cold and snowy","Foggy and wet",6]],"m4":[["What happened to some trees at noon?","They fell across the roads","They caught fire","They were cut down","They were painted",2],["What happened to the school?","It had a party","It was closed","It opened late","It moved away",4],["What did the local people do?","They left the village","They watched television","They went to the beach","They helped each other and cleaned the streets",5],["How did everyone feel at the end?","Relieved","Afraid","Angry","Tired of the weather",7]],"tf":[["There was thick fog on Friday morning.",1,1],["The wind was slow at noon.",0,2],["The flood happened in the village centre.",1,3],["The children went to school on Friday.",0,4]]},"4":{"t":"Good Table Manners","s":["Good table manners are an important part of etiquette in every country.","It is polite to wait until everyone has food before you start eating.","You should not talk with food in your mouth, because it is rude.","If you need to cough or sneeze, cover your mouth with a tissue.","Do not interrupt other people when they are speaking.","If you make a mistake, simply apologise and smile.","Afterwards, you should thank the host and offer to help clear the table.","Small habits like these show respect and make everyone feel comfortable."],"m3":[["When is it polite to start eating?","When you are very hungry","When everyone has food","When the host leaves",1],["Why should you not talk with food in your mouth?","It is rude","It is dangerous","It is slow",2],["What should you do when you sneeze?","Leave the room","Cover your mouth with a tissue","Say nothing and wait",3],["What should you do if you make a mistake?","Apologise and smile","Blame a friend","Ignore it",5]],"m4":[["What are table manners part of?","Etiquette","A school lesson","A sports rule","A cooking class",0],["What should you not do when others are speaking?","Smile","Nod","Listen","Interrupt them",4],["What should you do afterwards?","Go home at once","Thank the host and offer to help","Watch TV","Ask for more food",6],["What do small habits show?","Respect","Money","Age","Hunger",7]],"tf":[["You should start eating before others have food.",0,1],["Talking with food in your mouth is rude.",1,2],["You should never apologise.",0,5],["It is good to offer to help clear the table.",1,6]]},"5":{"t":"A Tiny House","s":["Nina and her parents live in a tiny house near the mountains.","It has only two rooms, but it feels cosy and warm.","The house has central heating, so the winters are comfortable.","Around the house there is a well-kept garden with a wooden fence.","From the window, you can see a beautiful landscape of green hills.","Nina's family chose a minimalist lifestyle, so they do not buy many things.","They recycle paper and plastic, and they use solar power for electricity.","Nina thinks small homes are easier to clean and cheaper to run."],"m3":[["Where does Nina live?","In a tiny house near the mountains","In a flat in the city","In a big house by the sea",0],["How many rooms does the house have?","Four","Two","Six",1],["What is around the house?","A swimming pool","A parking place","A garden with a wooden fence",3],["What do they use for electricity?","Solar power","Coal","Gas bottles",6]],"m4":[["Why are the winters comfortable?","Because of central heating","Because of a fireplace","Because it is warm outside","Because of thick walls only",2],["What can you see from the window?","A busy road","The sea","Tall buildings","Green hills",4],["Why does the family not buy many things?","They have no money","They chose a minimalist lifestyle","They do not like shops","They live far from town",5],["Why does Nina like small homes?","They are easier to clean","They have more rooms","They are older","They are noisy",7]],"tf":[["The house has five rooms.",0,1],["The house has central heating.",1,2],["The garden around the house is untidy.",0,3],["The family recycles paper and plastic.",1,6]]},"6":{"t":"The Clean Shore Campaign","s":["Last spring, thirteen-year-old Ravan noticed a lot of rubbish on the beach near his town.","He decided to start a campaign called Clean Shore.","He made posters and asked his classmates to join him.","Many people in the community wanted to help, and fifty volunteers came on the first day.","They collected single-use plastic bags, bottles and cans.","A local shop gave them gloves and bags, which was a great opportunity for the team.","The mayor praised the group and encouraged other schools to do the same.","Ravan says this achievement motivated him to keep going every month."],"m3":[["What did Ravan notice on the beach?","Broken boats","A lot of rubbish","Many tourists",0],["How did Ravan get his classmates to join?","He made posters and asked them","He gave them money","He phoned their parents",2],["How many volunteers came on the first day?","Five","Fifteen","Fifty",3],["Who gave the team gloves and bags?","The school","A local shop","The mayor",5]],"m4":[["What was the campaign called?","Green Town","Clean Shore","Save the Sea","Blue Beach",1],["What did the volunteers collect?","Shells and stones","Old clothes","Single-use plastic bags, bottles and cans","Wood",4],["What did the mayor do?","He closed the beach","He gave a prize of money","He joined the clean-up","He praised the group and encouraged other schools",6],["What motivated Ravan to keep going?","His achievement","A prize","His teacher","A trip",7]],"tf":[["Only five people came on the first day.",0,3],["The volunteers collected bottles and cans.",1,4],["A local shop gave gloves to the team.",1,5],["Ravan stopped after the first day.",0,7]]}},L={"1":{"t":"A Day at the Amusement Park","s":["Sara: Ben, are you coming to the amusement park on Saturday?","Ben: Yes! I am looking forward to the roller coaster.","Sara: I am afraid of it, so I will stay away from the big rides.","Ben: Don't worry. There are also small rides, and a huge Ferris wheel.","Sara: Is the park crowded at the weekend?","Ben: Usually it is, so we should arrive at nine, when it opens.","Sara: Good idea. Shall we take a picnic?","Ben: Yes, my mum will make sandwiches for us."],"m3":[["Which ride is Ben looking forward to?","The Ferris wheel","The roller coaster","The carousel",1],["What will Sara stay away from?","The small rides","The food","The big rides",2],["What time should they arrive?","At nine","At eleven","At noon",5],["Who will make the sandwiches?","Sara's dad","Ben's mum","Sara's sister",7]],"m4":[["When are they going to the park?","On Sunday","On Friday","On Saturday","On Monday",0],["What is huge at the park?","The shop","A Ferris wheel","The lake","The theatre",3],["What is the park usually like at the weekend?","Empty","Cold","Closed","Crowded",4],["What will they take with them?","A tent","A picnic","A football","A camera only",6]],"tf":[["Sara is afraid of the roller coaster.",1,2],["The park is usually empty at the weekend.",0,4],["They will arrive when the park opens.",1,5],["They will buy lunch at the park.",0,7]]},"2":{"t":"Ordering at a Restaurant","s":["Jack: Good evening! Are you ready to order?","Nora: Yes, please. I would like an appetiser first. What do you recommend?","Jack: Our onion rings are very popular. They are crispy and not oily.","Nora: Great! And for the main course, is the chicken curry spicy?","Jack: It is quite hot, but I can ask the chef to make it mild.","Nora: Yes, please. And I would like a small portion of rice.","Jack: Of course. Would you like a dessert?","Nora: Maybe later. First, a milkshake, please."],"m3":[["What does Jack recommend as an appetiser?","Onion rings","Soup","Salad",2],["What does Jack offer to ask the chef?","To add more salt","To make the curry mild","To cook faster",4],["What size of rice does Nora want?","A large portion","A small portion","No rice",5],["What does Nora want to drink?","Tea","Orange juice","A milkshake",7]],"m4":[["What does Jack ask at the beginning?","If she is ready to order","If she wants a table","If she has a ticket","If she likes music",0],["What does Nora want first?","A dessert","A main course","An appetiser","A drink",1],["What does Nora ask about the chicken curry?","If it is cheap","If it is spicy","If it is fresh","If it is cold",3],["What does Jack ask at the end?","If she wants a dessert","If she wants a bill","If she wants a taxi","If she wants a menu",6]],"tf":[["The onion rings are crispy.",1,2],["The curry is mild at first.",0,4],["Nora orders a large portion of rice.",0,5],["Nora orders a milkshake.",1,7]]},"3":{"t":"Planning a Weekend Hike","s":["Aida: Have you seen the weather forecast for the weekend?","Murad: Yes. It will be sunny on Saturday, but cold with a light breeze.","Aida: Then let's go hiking in the forest. We can have lunch near the river.","Murad: Good idea. But on Sunday there will be showers, so we should stay at home.","Aida: I agree. I can bring my camera to photograph the scenery.","Murad: Wonderful! Remember to wear warm clothes. The temperature may drop to five degrees.","Aida: Sure. Shall we meet at ten o'clock at the station?","Murad: Let's say nine, so we have more time on the trail."],"m3":[["What will the weather be like on Saturday?","Sunny with a light breeze","Foggy and wet","Hot and windy",1],["Where can they have lunch?","In a cafe","At the station","Near the river",2],["Why should they stay at home on Sunday?","There will be showers","They will be tired","The forest will be closed",3],["What will Aida bring?","A map","Her camera","A tent",4]],"m4":[["What are they talking about at the start?","The weather forecast","A school trip","A film","Their homework",0],["What may the temperature drop to?","Fifteen degrees","Ten degrees","Zero degrees","Five degrees",5],["Where does Aida suggest meeting?","At the river","At school","At the station","In the forest",6],["What time do they finally decide to meet?","Eight","Nine","Ten","Eleven",7]],"tf":[["They will go hiking in the forest.",1,2],["Sunday will be sunny.",0,3],["Murad tells Aida to wear warm clothes.",1,5],["They finally decide to meet at ten.",0,7]]},"4":{"t":"Rules in the School Library","s":["Ali: Excuse me, Mia. Can I use my phone in the library?","Mia: No, you can't. It may disturb other students.","Ali: Oh, sorry. I didn't know that. Is it allowed to eat there?","Mia: No, but you can drink water. And you must speak quietly.","Ali: What about borrowing books?","Mia: You can borrow three books for two weeks. Please bring them back on time.","Ali: Thank you. That is very helpful.","Mia: You're welcome! It's polite to ask, so never be shy about it."],"m3":[["Why can't Ali use his phone?","It is broken","It may disturb other students","It is too expensive",1],["What can students do in the library?","Drink water","Eat lunch","Play games",3],["How many books can Ali borrow?","Two","Five","Three",5],["What does Mia say about asking questions?","It is polite to ask","It is a waste of time","It is not allowed",7]],"m4":[["What does Ali ask first?","If he can use his phone","If he can sleep","If he can leave","If he can talk loudly",0],["What is not allowed in the library?","Reading","Writing","Studying","Eating",2],["What does Ali ask about next?","Opening hours","Borrowing books","Printing","Lost books",4],["How does Ali find Mia's advice?","Helpful","Boring","Difficult","Strange",6]],"tf":[["Students can use their phones in the library.",0,1],["Ali knew the rules before he came.",0,2],["Students must speak quietly in the library.",1,3],["Students should bring books back on time.",1,5]]},"5":{"t":"A Visit to the Space Museum","s":["Emily: My dad took me to the space museum yesterday.","Leo: Cool! What did you see there?","Emily: I saw a real astronaut's sleeping bag, and I learned that things float in space because there is no gravity.","Leo: That sounds funny. Could you try anything?","Emily: Yes, I tried on a space suit, but it was very heavy.","Leo: Would you like to live in space?","Emily: Not really. I would miss my family and my cosy room.","Leo: Me too. I prefer living on Earth, but I would like to go on a short trip."],"m3":[["Who took Emily to the museum?","Her teacher","Her dad","Her uncle",0],["Why do things float in space?","There is no gravity","There is no air","Space is very cold",2],["What was the space suit like?","Very heavy","Too small","Very colourful",4],["Why would Emily not live in space?","She is afraid of rockets","She dislikes food","She would miss her family and cosy room",6]],"m4":[["What does Leo ask Emily first?","How much the ticket cost","What she saw there","Who went with her","What time she left",1],["What real thing did Emily see?","A rocket","A map of Mars","A telescope","A sleeping bag",2],["What question does Leo ask about space?","If she would like to live there","If she can fly","If she has a telescope","If she likes stars",5],["What would Leo like to do?","Live in space","Become a pilot","Go on a short trip","Build a rocket",7]],"tf":[["Emily wants to live in space.",0,6],["Leo prefers living on Earth.",1,7],["The museum visit was last year.",0,0],["The sleeping bag at the museum was real.",1,2]]},"6":{"t":"Helping at the Animal Shelter","s":["Lina: Sam, I volunteered at the animal shelter on Sunday.","Sam: Really? What did you do there?","Lina: I fed the kittens and cleaned their cages. One tiny kitten was very thin.","Sam: Poor thing! Can people adopt the animals?","Lina: Yes, and the shelter also raises money with a charity sale every month.","Sam: I would love to help. Do they need more volunteers?","Lina: They always do. You can come with me next Sunday if you like.","Sam: Great! My brother wants to come too, and I will ask my mum for permission."],"m3":[["Where did Lina volunteer?","At a school","At an animal shelter","At a hospital",0],["What did Lina do there?","Walked the dogs","Painted the walls","Fed the kittens and cleaned cages",2],["How does the shelter raise money?","With a charity sale","With a concert","With a race",4],["When can Sam go with Lina?","Next Sunday","Tomorrow","Next month",6]],"m4":[["What was one kitten like?","Very fat","Very thin","Very noisy","Very old",2],["What can people do with the animals?","Sell them","Paint them","Adopt them","Teach them",3],["What does Sam want to do?","Help as a volunteer","Buy a kitten","Visit a zoo","Write a story",5],["Who else wants to come?","Sam's sister","Lina's mum","Sam's friend","Sam's brother",7]],"tf":[["Lina volunteered on Monday.",0,0],["One of the kittens was thin.",1,2],["The shelter does not need volunteers.",0,6],["Sam will ask his mum for permission.",1,7]]}},ES={"1":{"topic":"My Hobbies","words":[["be keen on something","nəyəsə həvəsi olmaq"],["improve","yaxşılaşdırmaq"],["creativity","yaradıcılıq"],["competition","yarış"],["relaxing","rahatladıcı"],["perfect","mükəmməl"],["origami","oriqami (kağız qatlama sənəti)"],["collect","toplamaq, yığmaq"]],"skel":["Paragraph 1 (Introduction): My favourite hobby is ... I am keen on it because ... .","Paragraph 2 (Body): I ... (do / make / collect) ... . It improves my ... . Last year I took part in ... .","Paragraph 3 (Conclusion): In conclusion, my hobby is ... because ... ."],"az":"Mənim ən sevimli hobbim oriqamidir. Mənim oriqamiyə böyük həvəsim var, çünki bu, çox rahatladıcıdır. Mən kağızı qatlayıram və quşlar, çiçəklər və qutular düzəldirəm. Oriqami mənim yaradıcılığımı inkişaf etdirir. Keçən il məktəb yarışında iştirak etdim və mükafat qazandım. Kağız quşum mükəmməl deyildi, amma müəllim onu bəyəndi. Nəticə olaraq, hobbim məni xoşbəxt edir.","en":"My favourite hobby is origami. I am keen on it because it is very relaxing. I fold paper and make birds, flowers and boxes. Origami improves my creativity. Last year I took part in a school competition and won a prize. My paper bird was not perfect, but the teacher liked it. In conclusion, my hobby makes me happy.","kw":["hobby","origami","keen on","relaxing","fold","improves","creativity","competition","perfect","conclusion"]},"2":{"topic":"My Favourite Food","words":[["cuisine","mətbəx, yemək bişirmə sənəti"],["traditional","ənənəvi"],["ingredients","inqrediyentlər, tərkib hissələri"],["flavour","ləzzət, dad"],["juicy","şirəli"],["yummy","dadlı, ləzzətli"],["recommend","məsləhət görmək"],["homemade","evdə hazırlanmış"]],"skel":["Paragraph 1 (Introduction): My favourite food is ... It is a traditional dish of ... cuisine.","Paragraph 2 (Body): It is made with ... (ingredients). It tastes ... . We usually eat it ... .","Paragraph 3 (Conclusion): In conclusion, I recommend it because ... ."],"az":"Mənim ən sevimli yeməyim plovdur. O, Azərbaycan mətbəxinin ənənəvi yeməyidir. Anam onu evdə düyü, ət və quru meyvələrlə hazırlayır. İnqrediyentlər sadədir, amma dadı möhtəşəmdir. Düyü yumşaq, ət isə şirəlidir. Biz onu adətən bayramlarda bütün ailə ilə yeyirik. Nəticə olaraq, mən onu hamıya məsləhət görürəm, çünki çox dadlıdır.","en":"My favourite food is plov. It is a traditional dish of Azerbaijani cuisine. My mother makes it at home with rice, meat and dried fruit. The ingredients are simple, but the flavour is wonderful. The rice is soft and the meat is juicy. We usually eat it on holidays with the whole family. In conclusion, I recommend it to everyone because it is very yummy.","kw":["favourite","plov","traditional","cuisine","ingredients","flavour","juicy","holidays","recommend","yummy"]},"3":{"topic":"My Favourite Weather","words":[["mild","mülayim (hava)"],["shine","parıldamaq, işıq saçmaq"],["breeze","meh, zəif külək"],["shower","narın yağış"],["fog","duman"],["freezing","çox soyuq, dondurucu"],["gale","fırtına, şiddətli külək"],["weather forecast","hava proqnozu"]],"skel":["Paragraph 1 (Introduction): My favourite weather is ... weather. In this weather the sun ... and ... .","Paragraph 2 (Body): I like it because I can ... . I do not like ... (fog / freezing days / gale) because ... .","Paragraph 3 (Conclusion): In conclusion, this weather makes me feel ... ."],"az":"Mənim ən sevimli havam yazın mülayim havasıdır. Günəş parlayır və yüngül meh əsir. Bəzən qısa narın yağış yağır, amma tezliklə kəsilir. Mən dumanı və dondurucu soyuq günləri sevmirəm, çünki çöldə oynaya bilmirəm. Keçən qış fırtına məktəbimizin yaxınlığında bir ağacı sındırdı. Mən çölə çıxmazdan əvvəl həmişə hava proqnozuna baxıram. Nəticə olaraq, mülayim hava məni xoşbəxt və rahat hiss etdirir.","en":"My favourite weather is mild spring weather. The sun shines and a light breeze blows. Sometimes there is a short shower, but it soon stops. I do not like fog or freezing days because I cannot play outside. Last winter a gale broke a tree near our school. I always check the weather forecast before I go out. In conclusion, mild weather makes me feel happy and relaxed.","kw":["weather","mild","shines","breeze","shower","fog","freezing","gale","forecast","conclusion"]},"4":{"topic":"Good Manners","words":[["manner","davranış, tərz"],["polite","nəzakətli"],["rude","kobud, qaba"],["interrupt","müdaxilə etmək, sözünü kəsmək"],["disturb","narahat etmək"],["sneeze","asqırmaq"],["cover","örtmək"],["apologise","üzr istəmək"]],"skel":["Paragraph 1 (Introduction): Good manners are important because ... . A polite person ... .","Paragraph 2 (Body): It is rude to ... . We must not ... . When I ... , I ... .","Paragraph 3 (Conclusion): In conclusion, good manners help us ... ."],"az":"Yaxşı davranış həyatımızda çox vacibdir. Nəzakətli adam \"zəhmət olmasa\" və \"təşəkkür edirəm\" deyir. Başqaları danışarkən onların sözünü kəsmək kobudluqdur. Biz sinifdə və ya kitabxanada başqalarını narahat etməməliyik. Mən asqıranda ağzımı örtürəm. Səhv etsəm, dərhal üzr istəyirəm. Nəticə olaraq, yaxşı davranış bir-birimizə hörmət etməyə kömək edir.","en":"Good manners are very important in our life. A polite person says please and thank you. It is rude to interrupt other people when they are speaking. We must not disturb others in class or in the library. When I sneeze, I cover my mouth. If I make a mistake, I apologise at once. In conclusion, good manners help us respect each other.","kw":["manners","polite","rude","interrupt","disturb","library","sneeze","cover","apologise","respect"]},"5":{"topic":"My Home","words":[["cosy","rahat, isti"],["well-kept","baxımlı, səliqəli"],["fence","hasar, çəpər"],["central heating","mərkəzi istilik"],["tiny","çox kiçik"],["landscape","mənzərə"],["comfort","rahatlıq"],["peaceful","sakit, hüzurlu"]],"skel":["Paragraph 1 (Introduction): I live in a ... in ... . It is ... and ... .","Paragraph 2 (Body): There is ... around the garden. My room is ... . From my window I can see ... .","Paragraph 3 (Conclusion): In conclusion, I love my home because ... ."],"az":"Mən kənddə kiçik bir evdə yaşayıram. O, rahat və baxımlıdır, bağın ətrafında isə hasar var. Evimizdə mərkəzi istilik var, ona görə qışda isti olur. Mənim otağım çox kiçikdir, amma bizə rahatlıq və istilik verir. Pəncərəmdən təpələri olan gözəl mənzərə görünür. Nəticə olaraq, mən evimi sevirəm, çünki o, sakit yerdir.","en":"I live in a small house in a village. It is cosy and well-kept, and there is a fence around the garden. We have central heating, so it is warm in winter. My room is tiny, but it gives us comfort and warmth. From my window I can see a beautiful landscape with hills. In conclusion, I love my home because it is a peaceful place.","kw":["village","cosy","well-kept","fence","central heating","tiny","comfort","landscape","conclusion","peaceful"]},"6":{"topic":"My Role Model","words":[["change-maker","dəyişiklik yaradan şəxs"],["community","icma, cəmiyyət"],["clean-up","təmizləmə, abadlaşdırma"],["campaign","kampaniya, təşviqat"],["raise money","pul toplamaq"],["achievement","nailiyyət, uğur"],["motivate","həvəsləndirmək"],["opportunity","imkan, fürsət"]],"skel":["Paragraph 1 (Introduction): My role model is ... She/He is a change-maker in our community.","Paragraph 2 (Body): Last year she/he ... . Her/His achievements motivate ... . She/He encourages us to ... .","Paragraph 3 (Conclusion): In conclusion, one person can ... ."],"az":"Mənim nümunə şəxsiyyətim əmim qızı Leyladır. O, bizim icmamızda dəyişiklik yaradan şəxsdir. Keçən il o, parkımızda təmizləmə kampaniyası təşkil etdi. O, həmçinin kiçik heyvan sığınacağı üçün pul topladı. Onun nailiyyətləri məni və dostlarımı həvəsləndirir. O, bizi başqalarına kömək etmək üçün hər imkandan istifadə etməyə ruhlandırır. Nəticə olaraq, bir insan böyük dəyişiklik edə bilər.","en":"My role model is my cousin Leyla. She is a change-maker in our community. Last year she organised a clean-up campaign in our park. She also raised money for a small animal shelter. Her achievements motivate me and my friends. She encourages us to use every opportunity to help others. In conclusion, one person can make a big change.","kw":["role model","change-maker","community","clean-up","campaign","raised money","achievements","motivate","encourages","opportunity"]}},PICS={"1":{"t":"In the park","words":[["bench","skamya"],["ball","top"],["dog","it"],["boy","oğlan"],["girl","qız"],["tree","ağac"],["grass","ot, çəmən"],["sky","səma"]],"model":"In the picture, I can see a park. There is a big tree on the left and a bench under it. A girl is sitting on the bench and she looks bored. In the middle, a boy is playing with a dog. There is a ball on the grass. At the top, the sky is blue. I think the boy is happy but the girl is lonely.","kw":["tree","bench","girl","boy","dog","ball","grass","sky","park"]},"2":{"t":"At the shop","words":[["shop assistant","satıcı"],["customer","müştəri"],["counter","piştaxta"],["cash register","kassa aparatı"],["coin","metal pul"],["bag","çanta"],["price","qiymət"],["shelf","rəf"]],"model":"In the picture, I can see a shop. There is a counter in the middle and a cash register on it. A shop assistant is standing behind the counter. A customer is in front of the counter and she has a bag. On the left there are shelves with things to buy. At the bottom, there are some coins. I think the customer is happy because the prices are low.","kw":["counter","register","assistant","customer","bag","shelves","coins","prices","shop"]},"3":{"t":"The countryside","words":[["farm","ferma"],["barn","tövlə"],["wagon","araba"],["cow","inək"],["tree","ağac"],["cloud","bulud"],["sun","günəş"],["path","cığır"]],"model":"In the picture, I can see the countryside. There is a red barn on the right and a tree next to it. In the middle, there is a wagon on a path. A cow is standing in front of the barn. At the top, the sun is shining and there are two white clouds. The weather is sunny and warm. It looks like a quiet and beautiful place. I would like to live there.","kw":["barn","tree","wagon","path","cow","sun","cloud","sunny","countryside"]},"4":{"t":"At the bus stop","words":[["bus","avtobus"],["bus stop","avtobus dayanacağı"],["traffic light","svetofor"],["building","bina"],["passenger","sərnişin"],["smartphone","smartfon"],["road","yol"],["sign","lövhə"]],"model":"In the picture, I can see a street. There is a bus on the road and a bus stop on the left. A passenger is waiting at the stop and he is using a smartphone. There is a traffic light next to the road. In the background, I can see tall buildings. At the top, there is a sign. It looks like a busy morning. I think the passenger is waiting for the bus to school.","kw":["bus","stop","passenger","phone","traffic light","buildings","road","street","waiting"]},"5":{"t":"The living room","words":[["sofa","divan"],["armchair","kreslo"],["lamp","lampa"],["bookcase","kitab şkafı"],["carpet","xalça"],["window","pəncərə"],["TV","televizor"],["picture","şəkil, tablo"]],"model":"In the picture, I can see a living room. There is a sofa in the middle and an armchair next to it. On the left, there is a bookcase full of books. There is a lamp next to the sofa and a carpet on the floor. A picture is on the wall and a TV is on the right. The window is behind the sofa. It looks comfortable and cosy. I like this room.","kw":["sofa","armchair","bookcase","lamp","carpet","picture","tv","window","living room"]},"6":{"t":"The winners","words":[["podium","kürsü, podium"],["trophy","kubok"],["medal","medal"],["flag","bayraq"],["winner","qalib"],["athlete","idmançı"],["first place","birinci yer"],["crowd","izdiham, tamaşaçılar"]],"model":"In the picture, I can see three athletes on a podium. The winner is in the middle on the first place and she is holding a trophy. The other athletes are on the left and on the right. They have medals around their necks. At the top, there are flags. I think they are very proud and happy. It looks like an important competition. All in all, success needs hard work.","kw":["podium","trophy","medal","flag","winner","athlete","first place","proud","competition"]}},SPK={"1":["My hobbies are drawing and playing football. I like drawing because it is relaxing, and I like football because I can play with my friends.","Yes, I would like to try photography. I want to take pictures of nature and show them to my family.","Last summer I visited a safari park with my family. It was very exciting because I saw lions and giraffes near our car."],"2":["My favourite food is pizza. It has a crispy base, tomato sauce and a lot of cheese, and I love its flavour.","No, I do not like very spicy food. It is too hot for me, so I prefer mild dishes.","I would like to try Japanese cuisine. I want to taste sushi because I have heard that it is very tasty."],"3":["My favourite weather is sunny and mild. I like it because I can go out with my friends and play in the park.","Yes, I have. Last winter there was a strong gale in our town, and we stayed at home all day.","I would prefer to live in a village. It is quiet and the air is clean, and I can enjoy nature every day."],"4":["Good table manners are important. We should not talk with food in our mouths, and we must say thank you to the cook.","We must come to school on time and listen to the teacher. We must also respect our classmates and keep the classroom clean.","Yes, I have. Once I called my teacher by the wrong name in front of the class. I felt embarrassed, so I apologised."],"5":["I live in a flat on the third floor with my family. It is cosy and bright, and I have my own small room.","No, I would not like to live in space. It is dangerous and I would miss my family and friends.","At home we recycle paper, plastic bottles and glass. We put them in different bins, and my mother takes them out every week."],"6":["My role model is my father. He works hard and always helps other people, so he motivates me.","Teenagers can help in their community. They can join a clean-up day, plant trees and encourage their friends to recycle.","Yes, I have. Last winter I found a cold kitten near our building. I gave it food and water, and then we found a new home for it."]},PHR12=[["In the picture, I can see ...","Şəkildə ... görürəm"],["There is a ... / There are ...","... var"],["On the left / on the right","Solda / sağda"],["In the middle / in the centre","Ortada"],["At the top / at the bottom","Yuxarıda / aşağıda"],["In the background / in the foreground","Arxa planda / ön planda"],["next to / behind / in front of / between","yanında / arxasında / qarşısında / arasında"],["It looks like ...","... kimi görünür"],["The weather is ...","Hava ..."],["I think they are (happy / bored ...)","Məncə onlar (xoşbəxt / darıxmış ...)"],["I like this picture because ...","Bu şəkil xoşuma gəlir, çünki ..."],["In my opinion, ... / All in all, ...","Mənim fikrimcə ... / Ümumi
