ag","shelves","coins","prices","shop"]},"8":{"t":"The winners","words":[["podium","kürsü, podium"],["trophy","kubok"],["medal","medal"],["flag","bayraq"],["winner","qalib"],["athlete","idmançı"],["first place","birinci yer"],["crowd","izdiham, tamaşaçılar"]],"model":"In the picture, I can see three athletes on a podium. The winner is in the middle on the first place and she is holding a trophy. The other athletes are on the left and on the right. They have medals around their necks. At the top, there are flags. I think they are very proud and happy. It looks like an important competition. All in all, success needs hard work.","kw":["podium","trophy","medal","flag","winner","athlete","first place","proud","competition"]}},SPK={"1":["My favorite thing is my bike. I ride it in the park with my friends.","I wear a white shirt, dark pants and black shoes to school.","My name is Aysel and I am eleven years old."],"2":["I am from Azerbaijan. I live in Baku.","I speak Azerbaijani and Russian. I am also learning English.","I would like to visit Japan. I want to see the mountains and eat sushi."],"3":["I live in a big apartment. It has a kitchen, a living room and two bedrooms.","There is a bed, a desk and a closet in my bedroom. I also have a lamp near the window.","My town is big. There are many shops, parks and schools."],"4":["I have a small family. I live with my mother, my father and my brother.","My mother is kind and she has long dark hair. My father is tall and he has short hair.","We have a party at home. We eat cake and my friends come."],"5":["I get up at seven o'clock.","After school I do my homework and play with my friends.","My favorite part of the day is the evening. I have dinner with my family."],"6":["My favorite subject is math. I like numbers and it is easy for me.","I go to school at eight o'clock. I have five lessons and a break for lunch.","My teacher is Ms. Leyla. She is kind and she teaches us English."],"7":["Today I am wearing a blue sweatshirt, j {"t":"A Journey by Train","s":["Last summer, my family travelled from Baku to Tbilisi by train.","We got on the train at the station at nine o'clock in the evening.","I packed a suitcase with clothes, a hat and a few books.","The journey took about twelve hours, so we slept on the train.","My little brother was a passenger for the first time, and he loved it.","In the morning, we crossed the border and had breakfast.","At the station in Tbilisi, we took a taxi to our hotel.","It was an incredible journey, and I want to travel by train again."],"m3":[["Where did the family start their journey?","In Baku","In Ganja","In Tbilisi",0],["What time did they get on the train?","Nine in the evening","Six in the morning","Noon",1],["How long did the journey take?","About twelve hours","Two days","Three hours",3],["How did they go to the hotel?","By taxi","By bus","By tram",6]],"m4":[["What did the writer pack?","Clothes, a hat and books","Toys and food","A tent","Only a map",2],["Who was a passenger for the first time?","The writer's brother","The writer","The father","The mother",4],["What did they do in the morning?","Crossed the border","Visited a museum","Got off the train","Went fishing",5],["How was the journey?","It was incredible","It was boring","It was scary","It was tiring",7]],"tf":[["The family travelled by plane.",0,0],["The journey took about twelve hours.",1,3],["The writer's brother loved the train.",1,4],["They took a bus to the hotel.",0,6]]},"6":{"t":"A Brave Firefighter","s":["Last Sunday, a fire started in a small shop near our school.","Many people were standing outside, and some were worried.","A firefighter named Rustam arrived in a few minutes with an ambulance.","While the others were waiting, he ran inside the building.","A little cat was crying under a table.","Rustam picked it up and carried it out safely.","Everybody clapped, and the cat's owner was very happy.","I think Rustam is a real hero because he is brave and kind."],"m3":[["What started ot uses a big engine.",0,4],["Emin's parents were amazed.",1,3],["The prize was a robot.",0,6]]},"8":{"t":"Why Trees Matter","s":["Trees are very important for our environment.","They give us clean air, and they also give homes to birds and insects.","However, people cut down many forests every year.","This is called deforestation, and it is a big danger for animals.","For example, the orangutan loses its habitat when forests disappear.","In addition, fewer trees mean dirtier air.","We can help by planting trees and by recycling plastic.","Our class is going to plant twenty trees next month."],"m3":[["What do trees give us?","Clean air","Plastic","Electricity",1],["What do people cut down every year?","Forests","Rivers","Hills",2],["Which animal loses its habitat?","The orangutan","The dolphin","The giraffe",4],["How many trees will the class plant?","Twenty","Ten","Fifty",7]],"m4":[["Who lives in trees?","Birds and insects","Fish and dolphins","Lions and tigers","Cats and dogs",1],["Deforestation is a big danger for whom?","Animals","Cars","Cities","Schools",3],["What happens when there are fewer trees?","The air is dirtier","The air is cleaner","It rains more","It is colder",5],["How can we help?","Plant trees and recycle plastic","Cut more trees","Use more plastic","Drive more cars",6]],"tf":[["Trees give homes to birds.",1,1],["Deforestation helps animals.",0,3],["People cut down many forests every year.",1,2],["The class will plant trees next year.",0,7]]}},L={"1":{"t":"Asking for Directions","s":["Tom: Excuse me, Nigar. Is there a library near here?","Nigar: Yes, there is. Go straight on and turn left at the bank.","Nigar: Then walk along the street. The library is next to the cinema.","Tom: Is there a restaurant near the library?","Nigar: Yes, there is a small restaurant behind it. It is very popular.","Tom: How often do you go there?","Nigar: I go twice a week, but I never go on Sundays because it is closed.","Tom: Thank you very much. I do not want to get l they heat the soup?","Twenty minutes","Two hours","Five minutes","One hour",7]],"tf":[["Emil can use the knife.",0,3],["The recipe is new.",1,5],["Emil can add some salt.",1,7],["Mum asks Emil to wash the rice.",0,1]]},"3":{"t":"A Safari Holiday","s":["Lala: Kamal, where were you last week?","Kamal: I was in Kenya with my family. We stayed at a safari camp, and it was an amazing adventure.","Lala: Wow! Was it expensive?","Kamal: No, it wasn't. The room was comfortable, and the food was delicious.","Lala: Were there any animals?","Kamal: Yes! There were elephants and giraffes near the hotel.","Lala: Weren't you afraid of the wild animals?","Kamal: No, I wasn't. The tour guide was with us all the time."],"m3":[["Where was Kamal last week?","In Kenya","In Egypt","In Turkey",1],["What was the food like?","Delicious","Cold","Awful",3],["Which animals were near the hotel?","Elephants and giraffes","Lions and monkeys","Hippos and wolves",5],["Who was with them all the time?","The tour guide","His cousin","A doctor",7]],"m4":[["Who went to Kenya with Kamal?","His family","His friends","His class","His cousin",1],["What was the room like?","Comfortable","Small","Dirty","Cold",3],["Where were the animals?","Near the hotel","In the pool","At school","In the town",5],["Was Kamal afraid?","No, he wasn't","Yes, very","A little","Only at night",7]],"tf":[["The hotel was expensive.",0,3],["There were elephants near the hotel.",1,5],["Kamal was in Kenya.",1,1],["Kamal was afraid of the animals.",0,7]]},"4":{"t":"A Book Review","s":["Gunel: Aydin, did you finish the book I gave you?","Aydin: Yes, I read it last weekend. It was an adventure story.","Gunel: What was it about?","Aydin: A girl found a map in a cave and followed it to a treasure.","Gunel: Did she find the treasure?","Aydin: Yes, but a wizard attacked her at the end. It was exciting.","Gunel: Did you like the ending?","Aydin: I loved it! I think it is a brilliant book, and I would give it five stars."],"m3":[["When did Ayd es a taxi.",0,1],["Nuray could ride a bike at seven.",0,4],["Ali's dad held the seat.",1,7]]},"6":{"t":"The Olympic Games","s":["Fidan: Orkhan, did you watch the Olympic Games last night?","Orkhan: Yes! I was watching the swimming race at eight o'clock.","Fidan: I was doing my homework, so I missed it. Who won?","Orkhan: A young athlete won the gold medal. She was only sixteen.","Fidan: Amazing! The ancient Olympic Games started in Greece, you know.","Orkhan: Yes, and the winners got a crown made of leaves.","Fidan: Which sport do you like best?","Orkhan: I like the long jump, but I am a bit lazy."],"m3":[["What was Orkhan watching at eight o'clock?","The swimming race","A football match","A boxing match",1],["What was Fidan doing?","Her homework","Watching TV","Eating dinner",2],["How old was the winner?","Sixteen","Twenty","Twelve",3],["Where did the ancient Olympic Games start?","In Greece","In Italy","In Egypt",4]],"m4":[["What did the young athlete win?","A gold medal","A silver medal","A crown","A car",3],["What did the ancient winners get?","A crown of leaves","A gold ring","Some money","A horse",5],["Which sport does Orkhan like best?","The long jump","Swimming","Boxing","Football",7],["Why did Fidan miss the race?","She was doing her homework","She was sleeping","She was ill","She was late",2]],"tf":[["Orkhan was watching the swimming race.",1,1],["Fidan watched the race.",0,2],["The winner was a young athlete.",1,3],["Orkhan likes boxing best.",0,7]]},"7":{"t":"A Missed Message","s":["Sevinj: Rauf, why didn't you answer my text message yesterday?","Rauf: Sorry! I was doing my homework when you wrote.","Sevinj: Was your cell phone off?","Rauf: No, but the battery died while I was studying.","Sevinj: Oh no! Is that phone yours or your brother's?","Rauf: It is mine. My brother's phone is the new one.","Sevinj: Mine is old, but it is not slow. I love it.","Rauf: Let's make a video for the science fair tomorrow. Our classmate has a tablet.","Sevinj: Great! I will explain the plan to our classmate."],"m3":[["What was Rauf doing when Sevinj wrote?","Homework","Playing games","Sleeping",1],["What happened to the battery?","It died","It exploded","It was lost",3],["Whose phone is the new one?","His brother's","Rauf's","Sevinj's",5],["What does Rauf want to make?","A video","A game","A poster",7]],"m4":[["What did Sevinj send?","A text message","A photo","A letter","A video",0],["When did the battery die?","While he was studying","While he was eating","While he was sleeping","While he was running",3],["Is Sevinj's phone slow?","No, it is not slow","Yes, very slow","It is broken","It is new",6],["What is the video for?","The science fair","The school party","A museum","A shop",7]],"tf":[["Rauf was doing homework.",1,1],["Rauf's phone is new.",0,5],["Sevinj's phone is old.",1,6],["The science fair is today.",0,7]]},"8":{"t":"Weather and the Water Cycle","s":["Lamiya: Dad, what is the weather forecast for tomorrow?","Dad: It will be cloudy in the morning, and then it will rain.","Lamiya: Rain again! Where does the rain come from?","Dad: It comes from the water cycle. The sun heats the ocean, and the water goes up as vapour.","Lamiya: And then?","Dad: The vapour becomes clouds. Later, the water falls as rain or snow.","Lamiya: So the water goes round and round?","Dad: Yes, exactly. That is why we should not waste water."],"m3":[["What will the weather be like in the morning?","Cloudy","Sunny","Windy",1],["What heats the ocean?","The sun","The wind","The moon",3],["What does the vapour become?","Clouds","Ice","Rivers",5],["How does water fall?","As rain or snow","As leaves","As sand",5]],"m4":[["Who asks about the weather forecast?","Lamiya","Dad","The teacher","Her brother",0],["How does the water go up?","As vapour","As ice","As soil","As plastic",3],["Where does the rain come from?","The water cycle","A big river","The wind","A factory",3],["What does Dad say we should not waste?","Water","Food","Paper","Time",7]],"tf":[["It will be sunny all day tomorrow.",0,1],["The sun heats the ocean.",1,3],["Water falls as rain or snow.",1,5],["The water goes round only once.",0,6]]}},ES={"1":{"topic":"My Town","words":[["park","park"],["library","kitabxana"],["stadium","stadion"],["supermarket","supermarket"],["street","küçə"],["usually","adətən"],["often","tez-tez"],["safe","təhlükəsiz"]],"skel":["Paragraph 1 (Introduction): I live in ... It is a ... town. My street is ... .","Paragraph 2 (Body): There is / There are ... in my town. I often go to ... . I usually go to school by ... .","Paragraph 3 (Conclusion): In conclusion, I like my town because ... ."],"az":"Mən kiçik bir şəhərdə yaşayıram. Mənim küçəm sakit və təhlükəsizdir. Evimin yanında böyük bir park var və mən tez-tez orada dostlarımla oynayıram. Şəhərimizdə həm də kitabxana, stadion və supermarket var. Mən adətən məktəbə qardaşımla piyada gedirəm. Şəhərimi sevirəm, çünki insanlar mehribandır. Nəticə olaraq, şəhərim kiçikdir, amma çox gözəldir.","en":"I live in a small town. My street is quiet and safe. There is a big park near my house, and I often play there with my friends. There is also a library, a stadium and a supermarket in my town. I usually walk to school with my brother. I love my town because the people are kind. In conclusion, my town is small but very nice.","kw":["town","street","safe","park","often","library","stadium","supermarket","usually","conclusion"]},"2":{"topic":"My Favourite Food","words":[["delicious","ləziz, dadlı"],["recipe","resept"],["chicken","toyuq əti"],["rice","düyü"],["vegetable","tərəvəz"],["cheese","pendir"],["healthy","sağlam, faydalı"],["fry","qızartmaq"]],"skel":["Paragraph 1 (Introduction): My favourite food is ... It is ... and ... .","Paragraph 2 (Body): The recipe is simple. First, we ... Then we ... We add ... .","Paragraph 3 (Conclusion): In conclusion, I like this food because ... ."],"az":"Mənim ən sevimli yeməyim düyü ilə toyuqdur. O, çox ləzzətli və sağlamdır. Anamın xüsusi resepti var. Əvvəlcə toyuğu qızardırıq, sonra düyünü bişiririk. Xörəyə bir az tərəvəz əlavə edirik. Mən üstünə pendir də xoşlayıram. Nəticə olaraq, bu yemək ailəm üçün ən yaxşısıdır.","en":"My favourite food is chicken with rice. It is very delicious and healthy. My mother has a special recipe. First, we fry the chicken, and then we cook the rice. We add some vegetables to the dish. I also like cheese on top. In conclusion, this meal is the best for my family.","kw":["favourite","chicken","rice","delicious","healthy","recipe","fry","vegetables","cheese","conclusion"]},"3":{"topic":"My Best Holiday","words":[["beach","çimərlik, sahil"],["sand","qum"],["swimming pool","üzgüçülük hovuzu"],["weather","hava"],["warm","isti, mülayim"],["picnic","piknik"],["amazing","heyranedici"],["local","yerli"]],"skel":["Paragraph 1 (Introduction): My best holiday was ... I went to ... with ... .","Paragraph 2 (Body): We stayed in ... The weather was ... I ... and ... .","Paragraph 3 (Conclusion): In conclusion, it was a ... holiday and I want to ... ."],"az":"Mənim ən yaxşı tətilim keçən yay idi. Biz ailəmlə çimərliyə getdik. Biz üzgüçülük hovuzu olan kiçik bir oteldə qaldıq. Hava isti və günəşli idi. Mən qumda oynadım və dənizdə üzdüm. Biz piknik etdik və yerli meyvə yedik. Bu, heyranedici bir tətil idi. Nəticə olaraq, mən oraya yenə getmək istəyirəm.","en":"My best holiday was last summer. We went to the beach with my family. We stayed in a small hotel with a swimming pool. The weather was warm and sunny. I played in the sand and swam in the sea. We had a picnic and ate local fruit. It was an amazing holiday. In conclusion, I want to go there again.","kw":["holiday","beach","hotel","weather","warm","sand","picnic","local","amazing","conclusion"]},"4":{"topic":"My Favourite Story","words":[["story","hekayə, nağıl"],["wolf","canavar, qurd"],["sheep","qoyun"],["villager","kəndli"],["shout","qışqırmaq, çığırmaq"],["angry","hirsli, əsəbi"],["moral","tərbiyəvi əhəmiyyət, ibrət"],["help","kömək etmək"]],"skel":["Paragraph 1 (Introduction): My favourite story is ... It is about ... .","Paragraph 2 (Body): One day ... Then ... Later ... At the end ... .","Paragraph 3 (Conclusion): The moral of the story is ... I like it because ... ."],"az":"Mənim ən sevimli hekayəm “Oğlan və canavar”dır. Bir oğlan kəndin yaxınlığında qoyunlara baxırdı. Bir gün o, zarafat etmək istədi və “Canavar!” deyə qışqırmağa başladı. Kəndlilər ona kömək etmək üçün qaçdılar, amma canavar yox idi. Onlar hirsli idilər. Sonra həqiqətən canavar gəldi və heç kim kömək etməyə gəlmədi. Hekayənin ibrəti belədir: yalan danışma. Mən bu hekayəni sevirəm, çünki o, mənə dürüst olmağı öyrədir.","en":"My favourite story is The Boy and the Wolf. A boy looked after the sheep near a village. One day he wanted to play a trick, so he began to shout, \"Wolf!\" The villagers ran to help him, but there was no wolf. They were angry. Later a real wolf came, and nobody came to help. The moral of the story is: do not tell lies. I like this story because it teaches me to be honest.","kw":["story","wolf","sheep","village","shout","villagers","angry","help","moral"]},"5":{"topic":"A Journey I Remember","words":[["train","qatar"],["ticket","bilet"],["station","dayanacaq, stansiya"],["mountain","dağ"],["lake","göl"],["travel","səyahət etmək"],["experience","təcrübə"],["fantastic","fantastik, əla"]],"skel":["Paragraph 1 (Introduction): I remember a journey to ... last ... I went with ... .","Paragraph 2 (Body): We went by ... We saw ... The journey was ... .","Paragraph 3 (Conclusion): In conclusion, it was a ... experience and I like to travel ... ."],"az":"Keçən il Gəncəyə etdiyim səfəri xatırlayıram. Biz oraya qatarla getdik. Atam biletləri vağzalda aldı. Yol uzun idi, amma əla idi. Göygöldə biz gözəl göl və böyük dağ gördük. Bu, mənim üçün yeni təcrübə idi. Nəticə olaraq, mən qatarla səyahət etməyi sevirəm.","en":"I remember a journey to Ganja last year. We went there by train. My father bought the tickets at the station. The journey was long, but it was fantastic. In Goygol we saw a beautiful lake and a big mountain. It was a new experience for me. In conclusion, I love to travel by train.","kw":["journey","train","tickets","station","fantastic","lake","mountain","experience","travel","conclusion"]},"6":{"topic":"My Hero","words":[["hero","qəhrəman"],["brave","cəsarətli, cəsur"],["kind","mehriban"],["clever","ağıllı"],["strong","güclü"],["firefighter","yanğınsöndürən"],["save","xilas etmək"],["happy","xoşbəxt, şən"]],"skel":["Paragraph 1 (Introduction): My hero is ... He / She is a ... .","Paragraph 2 (Body): He / She is ... and ... He / She can ... I feel ... when ... .","Paragraph 3 (Conclusion): In conclusion, ... is a real hero for me because ... ."],"az":"Mənim qəhrəmanım dayımdır. O, yanğınsöndürəndir. O, cəsarətli və güclüdür, həm də mehriban və ağıllıdır. O, insanları yanğından xilas edə bilir. O, öz işindən danışanda mən özümü xoşbəxt hiss edirəm. Mən də onun kimi olmaq istəyirəm. Nəticə olaraq, o, mənim üçün həqiqi qəhrəmandır.","en":"My hero is my uncle. He is a firefighter. He is brave and strong, and he is also kind and clever. He can save people from fire. I feel happy when he tells me about his work. I want to be like him. In conclusion, he is a real hero for me.","kw":["hero","uncle","firefighter","brave","strong","kind","clever","save","happy","conclusion"]},"7":{"topic":"A Great Invention","words":[["invention","icad, ixtira"],["tablet","planşet"],["cheap","ucuz"],["scientist","alim"],["battery","batareya"],["screen","ekran"],["wi-fi","wi-fi, simsiz internet"],["headphone","qulaqlıq"]],"skel":["Paragraph 1 (Introduction): A great invention for me is ... It is ... .","Paragraph 2 (Body): It has ... I use it to ... It helps me ... .","Paragraph 3 (Conclusion): In conclusion, this invention makes my life ... ."],"az":"Mənim üçün gözəl bir ixtira planşetdir. O, müasir texnologiyadır və onu alimlər icad ediblər. Planşet ucuz deyil, amma onun böyük ekranı var və mən ondan hər gün istifadə edirəm. Wi-fi ilə kitab oxuya və video izləyə bilirəm. Batareya bir neçə saat işləyir, ona görə də onu səfərə apara bilərəm. Mən həmçinin musiqi dinləmək üçün qulaqlıq istifadə edirəm. Nəticə olaraq, planşet həyatımı asanlaşdırır.","en":"A great invention for me is the tablet. It is modern technology, and scientists invented it. The tablet is not cheap, but it has a big screen, and I use it every day. With wi-fi I can read books and watch videos. The battery lasts for many hours, so I can take it on trips. I also use headphones to listen to music. In conclusion, the tablet makes my life easier.","kw":["invention","tablet","technology","scientists","screen","wi-fi","battery","headphones","conclusion"]},"8":{"topic":"Nature and Weather","words":[["weather forecast","hava proqnozu"],["sunny","günəşli"],["rainy","yağışlı"],["tree","ağac"],["flower","çiçək"],["rubbish","zibil"],["recycle","təkrar emal etmək"],["environment","ətraf mühit"]],"skel":["Paragraph 1 (Introduction): I love nature and the weather. I check the weather forecast every morning. My favourite weather is ... .","Paragraph 2 (Body): In spring / summer ... Nature is important for ... We should ... and ... .","Paragraph 3 (Conclusion): In conclusion, we must ... nature because ... ."],"az":"Mən təbiəti və havanı sevirəm. Hər səhər hava proqnozuna baxıram. Mənim ən sevimli havam günəşli havadır, amma yağışlı günlər çiçəklər və ağaclar üçün yaxşıdır. Yazda parkda çiçəklərə baxmağı xoşlayıram. Təbiət bizim ətraf mühitimiz üçün vacibdir. Bəzi insanlar zibili yerə atır və bu pisdir. Biz plastiki təkrar emal etməli və ağac əkməliyik. Nəticə olaraq, biz təbiəti təmiz saxlamalıyıq.","en":"I love nature and the weather. I check the weather forecast every morning. My favourite weather is sunny, but rainy days are good for flowers and trees. In spring I like to see the flowers in the park. Nature is important for our environment. Some people throw rubbish on the ground, and this is bad. We should recycle plastic and plant trees. In conclusion, we must keep nature clean.","kw":["nature","weather forecast","sunny","rainy","flowers","trees","environment","rubbish","recycle","conclusion"]}},PICS={"1":{"t":"At the bus stop","words":[["bus","avtobus"],["bus stop","avtobus dayanacağı"],["traffic light","svetofor"],["building","bina"],["passenger","sərnişin"],["smartphone","smartfon"],["road","yol"],["sign","lövhə"]],"model":"In the picture, I can see a street. There is a bus on the road and a bus stop on the left. A passenger is waiting at the stop and he is using a smartphone. There is a traffic light next to the road. In the background, I can see tall buildings. At the top, there is a sign. It looks like a busy morning. I think the passenger is waiting for the bus to school.","kw":["bus","stop","passenger","phone","traffic light","buildings","road","street","waiting"]},"2":{"t":"At the shop","words":[["shop assistant","satıcı"],["customer","müştəri"],["counter","piştaxta"],["cash register","kassa aparatı"],["coin","metal pul"],["bag","çanta"],["price","qiymət"],["shelf","rəf"]],"model":"In the picture, I can see a shop. There is a counter in the middle and a cash register on it. A shop assistant is standing behind the counter. A customer is in front of the counter and she has a bag. On the left there are shelves with things to buy. At the bottom, there are some coins. I think the customer is happy because the prices are low.","kw":["counter","register","assistant","customer","bag","shelves","coins","prices","shop"]},"3":{"t":"At the beach","words":[["sea","dəniz"],["umbrella","çətir"],["lifeguard","xilasedici"],["boat","qayıq"],["flag","bayraq"],["sand","qum"],["sun","günəş"],["wave","dalğa"]],"model":"In the picture, I can see a beach. The sun is shining at the top and the sea is behind. There is a lifeguard tower on the right with a red flag. In the middle, there is an umbrella on the sand. A boat is on the sea in the background. The weather is hot and sunny. I think it is a safe place because there is a lifeguard. I like swimming here.","kw":["sea","sun","lifeguard","flag","umbrella","sand","boat","sunny","beach"]},"4":{"t":"The living room","words":[["sofa","divan"],["armchair","kreslo"],["lamp","lampa"],["bookcase","kitab şkafı"],["carpet","xalça"],["window","pəncərə"],["TV","televizor"],["picture","şəkil, tablo"]],"model":"In the picture, I can see a living room. There is a sofa in the middle and an armchair next to it. On the left, there is a bookcase full of books. There is a lamp next to the sofa and a carpet on the floor. A picture is on the wall and a TV is on the right. The window is behind the sofa. It looks comfortable and cosy. I like this room.","kw":["sofa","armchair","bookcase","lamp","carpet","picture","tv","window","living room"]},"5":{"t":"The countryside","words":[["farm","ferma"],["barn","tövlə"],["wagon","araba"],["cow","inək"],["tree","ağac"],["cloud","bulud"],["sun","günəş"],["path","cığır"]],"model":"In the picture, I can see the countryside. There is a red barn on the right and a tree next to it. In the middle, there is a wagon on a path. A cow is standing in front of the barn. At the top, the sun is shining and there are two white clouds. The weather is sunny and warm. It looks like a quiet and beautiful place. I would like to live there.","kw":["barn","tree","wagon","path","cow","sun","cloud","sunny","countryside"]},"6":{"t":"The winners","words":[["podium","kürsü, podium"],["trophy","kubok"],["medal","medal"],["flag","bayraq"],["winner","qalib"],["athlete","idmançı"],["first place","birinci yer"],["crowd","izdiham, tamaşaçılar"]],"model":"In the picture, I can see three athletes on a podium. The winner is in the middle on the first place and she is holding a trophy. The other athletes are on the left and on the right. They have medals around their necks. At the top, there are flags. I think they are very proud and happy. It looks like an important competition. All in all, success needs hard work.","kw":["podium","trophy","medal","flag","winner","athlete","first place","proud","competition"]},"7":{"t":"At the film set","words":[["camera","kamera"],["director's chair","rejissor kreslosu"],["light","işıq"],["clapperboard","kadr taxtası"],["actor","aktyor"],["microphone","mikrofon"],["costume","kostyum"],["set","çəkiliş meydançası"]],"model":"In the picture, I can see a film set. There is a camera on the left and a big light behind it. In the middle, an actor is standing in a costume. There is a director's chair next to the actor. At the bottom, I can see a clapperboard. It looks like they are making a film. I think the actor is nervous. All in all, I like this picture because I love films.","kw":["camera","light","actor","chair","costume","film","director","clapper"]},"8":{"t":"In the park","words":[["bench","skamya"],["ball","top"],["dog","it"],["boy","oğlan"],["girl","qız"],["tree","ağac"],["grass","ot, çəmən"],["sky","səma"]],"model":"In the picture, I can see a park. There is a big tree on the left and a bench under it. A girl is sitting on the bench and she looks bored. In the middle, a boy is playing with a dog. There is a ball on the grass. At the top, the sky is blue. I think the boy is happy but the girl is lonely.","kw":["tree","bench","girl","boy","dog","ball","grass","sky","park"]}},SPK={"1":["My town is small and quiet. There is a park, a library, a market and a big supermarket.","I go to the park every weekend. I go to the library once a week, and I go to the market with my mother on Sundays.","I usually walk to school with my friends. It takes about ten minutes."],"2":["My favourite food is pizza. It is hot and cheesy, and it has a delicious flavour.","Yes, I can cook a little. I can make a salad, fried eggs and simple soup.","I usually have bread, cheese and an egg for breakfast. I also drink a cup of tea."],"3":["Last summer I went to the sea with my family. We stayed in a hotel near the beach.","Yes, it was sunny and warm. The people were very friendly and kind.","Next summer I would like to go to the mountains. I want to see the forests and rivers."],"4":["My favourite story is The Boy and the Wolf. It is short, but it has a good lesson.","A boy told a lie, and the villagers came to help him. Later a real wolf came, but nobody helped him.","I like to read because I can imagine the story in my own way. I also like to listen to my grandmother, because she tells interesting stories."],"5":["I travel to school by bus. It takes about fifteen minutes.","I remember a trip to Ganja by train. We saw mountains and a beautiful lake, and I was very happy.","We should wear a seat belt in the car. We should also cross the road carefully and use a helmet on a bike."],"6":["My hero is my father. He is kind and hard-working, and he always helps other people.","A good person is kind, honest and brave. He or she helps others and tells the truth.","I like football. My favourite athlete is Cristiano Ronaldo because he is strong and works very hard."],"7":["I think the phone is the most useful invention. I can call my family and find information quickly.","I use a phone and a computer every day. I also watch videos and do my homework online.","I would like to invent a robot for the home. It could clean my room and help my mother in the kitchen."],"8":["My favourite season is spring. I love warm and sunny weather, and I like to see flowers.","We can plant trees and recycle plastic. We should not throw rubbish on the ground.","Today it is cloudy and a little windy. It is not cold, but I think it will rain later."]},PHR12=[["In the picture, I can see ...","Şəkildə ... görürəm"],["There is a ... / There are ...","... var"],["On the left / on the right","Solda / sağda"],["In the middle / in the centre","Ortada"],["At the top / at the bottom","Yuxarıda / aşağıda"],["In the background / in the foreground","Arxa planda / ön planda"],["next to / behind / in front of / between","yanında / arxasında / qarşısında / arasında"],["It loo l",1],["How long is each episode?","Twenty minutes","Forty minutes","One hour",2],["Who watches the cartoon with the writer?","His younger brother","His best friend","His mother",3],["Why does the writer like Mia?","She is brave and clever","She is very funny","She is the youngest",4]],"m4":[["How many seasons are there?","Three","One","Two","Four",2],["Where does the writer watch the cartoon?","On a streaming platform","On the news","At the cinema","On a game show",3],["Who is the director?","A famous animator from Japan","A school teacher","A young actor","A scientist",5],["Why is the cartoon better than a comedy for the writer?","It teaches us about science","It is shorter","It has more songs","It is cheaper",6]],"tf":[["The cartoon is about children in a rocket.",1,1],["Each episode lasts an hour.",0,2],["The writer watches the cartoon alone.",0,3],["Mia is a brave character.",1,4]]},"2":{"t":"A Journey in a Wagon","s":["In the 1800s, many pioneers left their homes and travelled west in wagons.","The journey was long and the weather was often terrible.","In spring the roads were muddy, and in winter they were icy and dangerous.","Oxen pulled the heavy wagons because they were strong.","Families carried food, blankets, and a few kitchen things like cups and plates.","Children walked next to the wagon and helped their parents.","After four months, the pioneers finally reached their new farm in the countryside."],"m3":[["When did the pioneers travel?","In the 1800s","In the 1500s","Last year",0],["Why were the roads difficult in spring?","They were muddy","They were icy","They were dry",2],["Which animals pulled the wagons?","Oxen","Horses","Dogs",3],["Where did the pioneers go at the end?","To a new farm","To a big city","To the sea",6]],"m4":[["How did the pioneers travel?","In wagons","By train","By bus","By plane",0],["What did families carry?","Food, blankets and kitchen things","Computers and phones","Furniture and cars","Only clothes",4],["What did the children do?","They walked and helped their parents","They slept all day","They stayed at home","They drove the wagon",5],["How long was the journey?","Four months","Four days","Four years","Four weeks",6]],"tf":[["The weather was always sunny.",0,1],["Oxen were strong enough to pull wagons.",1,3],["Families took cups and plates with them.",1,4],["The pioneers arrived in a city.",0,6]]},"3":{"t":"The Boy and the Wolf","s":["Once there was a shepherd boy who looked after sheep on a hill.","He felt bored and lonely because he was alone all day.","One day he shouted, \"Help! A wolf is coming!\"","The villagers ran to help him, but there was no wolf.","The boy laughed at them, and the villagers were angry.","The next week a real wolf came, and the boy was terrified.","He shouted again, but nobody came because they did not believe him.","The moral is: if you tell lies, people will not trust you."],"m3":[["What was the boy's job?","He looked after sheep","He sold milk","He taught children",0],["How did the boy feel at the beginning?","Bored and lonely","Happy and excited","Angry and tired",1],["How did the villagers feel after the first joke?","Angry","Surprised and happy","Afraid",4],["What is the moral of the story?","If you tell lies, people will not trust you","Wolves are dangerous","Always be quiet",7]],"m4":[["Where was the boy?","On a hill","In a jungle","In the village","At school",0],["Why did the villagers run?","They wanted to help him","They wanted to play","They were afraid of him","They wanted food",3],["Why did nobody come the second time?","They did not believe him","They were sleeping","They did not hear him","They were on holiday",6],["How did the boy feel when the real wolf came?","Terrified","Silly","Bored","Excited",5]],"tf":[["The boy was with his friends all day.",0,1],["The first wolf was real.",0,3],["A real wolf came later.",1,5],["This story is a fable with a moral.",1,7]]},"4":{"t":"Saving for a Bike","s":["My name is Leyla and I want to buy a new bike.","It costs ninety manats, so I cannot afford it yet.","I earn some money by helping my neighbour with her shopping.","Every week I save ten manats and I do not spend it on sweets.","My brother is generous, so he lent me twenty manats.","I promised to pay him back in two months.","In my opinion, saving money is a good habit, and I will have my bike soon."],"m3":[["What does Leyla want to buy?","A new bike","A phone","A book",0],["How does Leyla earn money?","By helping her neighbour","By selling toys","By washing cars",2],["How much does she save every week?","Ten manats","Twenty manats","Ninety manats",3],["Who lent her money?","Her brother","Her mother","Her friend",4]],"m4":[["How much does the bike cost?","Ninety manats","Twenty manats","Ten manats","One hundred manats",1],["How much did her brother lend her?","Twenty manats","Ten manats","Ninety manats","Thirty manats",4],["When will she pay him back?","In two months","Tomorrow","In two years","Next week",5],["What does Leyla think about saving?","It is a good habit","It is boring","It is difficult","It is useless",6]],"tf":[["Leyla can afford the bike now.",0,1],["She spends her money on sweets.",0,3],["Her brother is generous.",1,4],["She will pay her brother back.",1,5]]},"5":{"t":"Keret House","s":["Keret House in Warsaw is one of the thinnest houses in the world.","It is only 92 centimetres wide at its narrowest point.","The architect built it between two old apartment buildings.","To enter, you have to climb a ladder and go through a trap door.","Inside there is a small kitchen, a bathroom, a bedroom and a tiny desk.","The bed is not as big as an ordinary bed, but it is comfortable enough.","An author lives there, and he says the house helps him to be creative."],"m3":[["Where is Keret House?","In Warsaw","In Baku","In London",0],["How do you enter the house?","Through a trap door","Through the window","Through a big gate",3],["Who lives in the house?","An author","A doctor","A firefighter",6],["What ning","Only with animals","Only at night",1]],"tf":[["It is safe to swim alone.",0,1],["Rip currents pull people away from the beach.",1,2],["You should struggle in a rip current.",0,3],["Water can help you avoid heat cramps.",1,5]]},"7":{"t":"My Smartphone","s":["I use my smartphone every day.","I send a message to my friends, and I make a video chat with my grandparents.","I download new apps, but I delete the ones I do not need.","The screen is big, so I can watch short films on it.","My mother says I use it too much, so I switch it off at nine o'clock.","In the future, I think phones will be even smaller and voice-activated.","However, I still believe that talking face to face is the best way to communicate."],"m3":[["Who does the writer video chat with?","His grandparents","His teachers","His cousins",1],["What does the writer do with apps he does not need?","He deletes them","He sells them","He shares them",2],["When does he switch off the phone?","At nine o'clock","At six o'clock","At midnight",4],["What will phones be like in the future?","Smaller and voice-activated","Bigger and heavier","Cheaper and slower",5]],"m4":[["What can he watch on the screen?","Short films","Football matches only","The news only","Nothing",3],["Why does his mother talk to him?","He uses the phone too much","He is lazy","He is sick","He lost the phone",4],["What does he download?","New apps","Cars","Houses","Books only",2],["What is the best way to communicate for him?","Talking face to face","Sending emojis","Writing emails","Using social media",6]],"tf":[["He uses his phone only at the weekend.",0,0],["He has a video chat with his grandparents.",1,1],["His phone screen is tiny.",0,3],["He thinks face-to-face talking is the best.",1,6]]},"8":{"t":"A Young Inventor","s":["Ali is thirteen years old, and he is a very talented inventor.","When he was ten, he made a small robot from old phone parts.","His teacher said he had great intelligence and a lot of determination.","Ali did not give up when his first prototype did not work.","He tried again and again, and after six months, his gadget finally worked.","Now many students look up to him.","He says, \"Success comes when you believe in yourself and never stop working.\""],"m3":[["How old is Ali?","Thirteen","Ten","Sixteen",0],["What did he make at the age of ten?","A small robot","A computer","A bicycle",1],["What happened to his first prototype?","It did not work","It was perfect","It was lost",3],["How long did it take for the gadget to work?","Six months","Six days","Six years",4]],"m4":[["What did Ali use to make the robot?","Old phone parts","New toys","Wood","Paper",1],["What did the teacher say about Ali?","He has great intelligence and determination","He is lazy","He is bored","He is selfish",2],["How do students feel about Ali?","They look up to him","They are angry","They are afraid","They laugh at him",5],["What helps people to succeed, according to Ali?","Believing in yourself and working","Being rich","Being lucky","Having a big house",6]],"tf":[["Ali is an old inventor.",0,0],["Ali gave up after the first failure.",0,3],["His gadget finally worked.",1,4],["Ali thinks success needs belief and work.",1,6]]},"9":{"t":"A Night at the Concert","s":["Last Saturday I went to a concert at the city hall.","A rock band played loud music with guitars, drums and a bass.","The singer had a strong voice, and the audience sang with her.","In the middle of the show, a young man played a solo on the saxophone.","On the downside, the tickets were expensive and the hall was very hot.","All in all, it was a superb evening.","I think it is a must-see for every music fan."],"m3":[["Where was the concert?","At the city hall","At school","In a park",0],["What kind of band played?","A rock band","A jazz band","A folk band",1],["Which instrument did the young man play?","The saxophone","The violin","The piano",3],["What was the downside?","The tickets were expensive","The music was bad","The band was late",4]],"m4":[["When did the writer go to the concert?","Last Saturday","Last Monday","Yesterday","Last year",0],["How was the singer's voice?","Strong","Quiet","Weak","Bad",2],["What did the audience do?","They sang with the singer","They left early","They slept","They danced on the stage",2],["What does the writer think about the evening?","It was superb","It was boring","It was terrible","It was average",5]],"tf":[["The concert was on a Friday.",0,0],["The band used drums and guitars.",1,1],["The hall was cold.",0,4],["The writer recommends the concert.",1,6]]}},L={"1":{"t":"At the Film Set","s":["Anna: Hi, Tom! Are you an actor in this film?","Tom: No, I am a camera operator. I film every scene.","Anna: Who is the director?","Tom: Mr Brown. He is very strict, and he wants everything perfect.","Anna: What time does the shooting start?","Tom: At nine o'clock, but the makeup artist starts at seven.","Anna: Wow! That is early. Do you like your job?","Tom: Yes, I love it, because every day is different."],"m3":[["What is Tom's job?","Camera operator","Actor","Director",1],["What is the director like?","Strict","Funny","Shy",3],["What time does the shooting start?","At nine o'clock","At seven o'clock","At ten o'clock",5],["Why does Tom like his job?","Every day is different","The pay is high","It is easy",7]],"m4":[["Who is Anna talking to?","A camera operator","A teacher","A doctor","A singer",1],["What is the director's name?","Mr Brown","Mr Green","Mr White","Mr Black",3],["Who starts work at seven?","The makeup artist","The actor","The director","The sound engineer",5],["How does Anna feel about the early start?","Surprised","Happy","Angry","Bored",6]],"tf":[["Tom is an actor.",0,1],["The director wants everything perfect.",1,3],["Shooting starts at seven.",0,5],["Tom loves his job.",1,7]]},"2":{"t":"The Weather Report","s":["Good morning! Here is the weather for today.","In the north it is cold and icy, so please drive carefully.","In the east it is cloudy with some er he found out?","Silly","Sad","Lonely","Excited",6]],"tf":[["Ben slept well.",0,1],["Ben was terrified.",1,3],["It was a robber.",0,5],["Ben is sleepy now.",1,7]]},"4":{"t":"At the Shop","s":["Shop assistant: Can I help you?","Ali: Yes, please. How much is this backpack?","Shop assistant: It costs thirty manats.","Ali: Hmm, I can only afford twenty-five. Do you have a cheaper one?","Shop assistant: Yes, this blue one is inexpensive. It is twenty manats.","Ali: Great! I will take it. Can I pay by card?","Shop assistant: I am sorry, we only take cash.","Ali: No problem. Here you are."],"m3":[["How much is the first backpack?","Thirty manats","Twenty-five manats","Twenty manats",2],["How much money can Ali afford?","Twenty-five manats","Thirty manats","Fifty manats",3],["What colour is the cheaper backpack?","Blue","Red","Green",4],["How does Ali pay?","In cash","By card","He does not pay",6]],"m4":[["What does Ali want to buy?","A backpack","A phone","A jacket","A book",1],["How much is the blue backpack?","Twenty manats","Thirty manats","Twenty-five manats","Ten manats",4],["Can Ali pay by card?","No, only cash","Yes","Only on Monday","Only online",6],["How does Ali feel about it?","He has no problem","He is angry","He is worried","He is upset",7]],"tf":[["The first backpack is cheap.",0,2],["Ali can afford thirty manats.",0,3],["The blue backpack is inexpensive.",1,4],["The shop takes cards.",0,6]]},"5":{"t":"Moving House","s":["Mum: Dad, where do we put the sofa?","Dad: In the living room, next to the window.","Mum: And the wardrobe?","Dad: It is too big for the bedroom. Let's put it in the hall.","Mum: Okay. Who will do the dishes tonight?","Dad: I will. And Emma has to vacuum the carpet.","Emma: Oh no! I don't want to vacuum!","Mum: You have to. Everybody helps in this house."],"m3":[["Where does the sofa go?","In the living room","In the kitchen","In the bedroom",1],["Where do they put the wardrobe?","In the hall","In the bedroom","In the kitchen",3],["Who will do the dishes?","Dad","Mum","Emma",5],["What does Emma have to do?","Vacuum the carpet","Make the bed","Wash the car",5]],"m4":[["Where is the sofa?","Next to the window","Behind the door","On the balcony","In the garden",1],["Why does the wardrobe go to the hall?","It is too big","It is broken","It is dirty","It is old",3],["How does Emma feel?","She does not want to vacuum","She is very happy","She is sleepy","She is excited",6],["What does Mum say?","Everybody helps","Nobody helps","Emma can stay free","Dad does everything",7]],"tf":[["The sofa goes next to the window.",1,1],["The wardrobe fits in the bedroom.",0,3],["Mum will do the dishes.",0,5],["Everybody must help.",1,7]]},"6":{"t":"At the Doctor's","s":["Doctor: What happened to you, Nick?","Nick: I slipped on the wet floor and fell on my wrist.","Doctor: Does it hurt?","Nick: Yes, a lot. And my knee is bruised, too.","Doctor: I think your wrist is sprained. It is not broken.","Nick: That is good news!","Doctor: You must rest for two weeks and avoid sport.","Nick: Okay, I will be careful from now on."],"m3":[["How did Nick get hurt?","He slipped on a wet floor","He fell off a bike","A dog bit him",1],["Which part is bruised?","His knee","His elbow","His chin",3],["What is wrong with the wrist?","It is sprained","It is broken","It is cut",4],["For how long must he rest?","Two weeks","Two days","Two months",6]],"m4":[["What hurts a lot?","His wrist","His head","His heel","His neck",2],["What does the doctor say?","The wrist is not broken","The wrist is broken","Nick must go home now","Nick is fine",4],["What must Nick avoid?","Sport","School","Food","Sleep",6],["What will Nick do from now on?","Be careful","Run more","Stop school","Play football",7]],"tf":[["Nick slipped on a wet floor.",1,1],["His wrist is broken.",0,4],["Nick must rest for two weeks.",1,6],["Nick's knee is fine.",0,3]]},"7":{"t":"Getting to School","s":["Teacher: How do you come to school, Zara?","Zara: I get on the number five bus at half past seven.","Teacher: And you, Murad?","Murad: I go on foot because I live near the school.","Teacher: Does anyone take the metro?","Zara: Rustam does. He gets off at the park and walks for five minutes.","Teacher: In the future, we will probably have flying cars!","Murad: I hope so! That would be exciting."],"m3":[["How does Zara go to school?","By bus","On foot","By metro",1],["Why does Murad go on foot?","He lives near the school","He likes walking","The bus is slow",3],["Where does Rustam get off?","At the park","At the school","At the bus stop",5],["What does the teacher say about the future?","We may have flying cars","We will not use cars","We will use jetpacks only",6]],"m4":[["Which bus does Zara take?","Number five","Number three","Number fifteen","Number fifty",1],["What time does Zara get on the bus?","Half past seven","Seven o'clock","Eight o'clock","Half past eight",1],["How long does Rustam walk?","Five minutes","Fifteen minutes","One hour","Ten minutes",5],["How does Murad feel about flying cars?","Excited","Afraid","Bored","Angry",7]],"tf":[["Murad takes the metro.",0,3],["Rustam takes the metro.",1,5],["Zara gets on the bus at half past seven.",1,1],["The teacher talks about the past.",0,6]]},"8":{"t":"A Winner Speaks","s":["Reporter: Congratulations on winning the gold medal, Aysel!","Aysel: Thank you! I am so happy and proud.","Reporter: How many hours do you train every day?","Aysel: I train for four hours, six days a week.","Reporter: What helps you to succeed?","Aysel: Determination. I never give up, even when it is difficult.","Reporter: What advice do you have for young people?","Aysel: Believe in yourself and work hard."],"m3":[["What did Aysel win?","A gold medal","A silver medal","A trophy",0],["How many hours does she train every day?","Four","Six","Two",3],["How many days a week does she train?","Six","Seven","Five",3],["What is her advice?","Believe in yourself and work hard","Be lucky","Buy new shoes",7]],"m4":[["How does Aysel feel?","Happy and proud","Tired and sad","Angry","Worried",1],["What helps her to succeed?","Determination","Luck","Money","Her coach only",5],["What does she do when it is difficult?","She never gives up","She stops","She cries","She sleeps",5],["Who is she talking to?","A reporter","A teacher","A doctor","Her brother",0]],"tf":[["Aysel won a silver medal.",0,0],["She trains four hours every day.",1,3],["She gives up when things are difficult.",0,5],["She says young people should work hard.",1,7]]},"9":{"t":"Choosing a Dance Class","s":["Lara: Hi, Ellie! Are you going to join a dance class?","Ellie: Yes, I want to try hip-hop. What about you?","Lara: I prefer ballet dancing. I love classical music.","Ellie: My brother plays the drums in a rock band.","Lara: Cool! Does he play at concerts?","Ellie: Yes, every month. Tickets are not expensive, so come and listen!","Lara: I will! I like all kinds of music.","Ellie: Great! See you on Saturday."],"m3":[["Which dance does Ellie want to try?","Hip-hop","Ballet","Salsa",1],["What does Lara prefer?","Ballet dancing","Hip-hop","Breakdancing",2],["What instrument does Ellie's brother play?","The drums","The guitar","The violin",3],["When will they meet?","On Saturday","On Sunday","On Monday",7]],"m4":[["What kind of music does Lara love?","Classical music","Rock","Folk","Jazz",2],["How often does the brother play at concerts?","Every month","Every week","Every day","Every year",5],["How are the tickets?","Not expensive","Very expensive","Free","Sold out",5],["What does Lara say about music?","She likes all kinds","She hates rock","She likes only ballet","She plays the drums",6]],"tf":[["Lara wants to try hip-hop.",0,2],["Ellie's brother plays the drums.",1,3],["Tickets are very expensive.",0,5],["Lara will come to the concert.",1,6]]}},ES={"1":{"topic":"My Favourite TV Show","words":[["favourite","sevimli"],["episode","seriya"],["character","personaj"],["funny","gülməli"],["exciting","həyəcanlı"],["every week","hər həftə"],["watch","izləmək"],["because","çünki"]],"skel":["Paragraph 1 (Introduction): My favourite TV show is ... It is a ... (cartoon / comedy / documentary).","Paragraph 2 (Body): I watch it ... . My favourite character is ... because he/she is ... .","Paragraph 3 (Conclusion): In conclusion, I like this show because ... ."],"az":"Mənim ən sevimli televiziya verilişim cizgi filmidir. Mən onu hər həftə dostlarımla izləyirəm. Hər seriya iyirmi dəqiqə davam edir. Ən sevimli personajım Maksdır, çünki o, çox gülməli və cəsurdur. Nəticə olaraq, mən bu cizgi filmini sevirəm, çünki həm həyəcanlı, həm də faydalıdır.","en":"My favourite TV show is a cartoon. I watch it every week with my friends. Each episode lasts twenty minutes. My favourite character is Max because he is very funny and brave. In conclusion, I like this cartoon because it is exciting and useful.","kw":["favourite","cartoon","watch","every week","episode","character","funny","brave","conclusion","exciting"]},"2":{"topic":"My Favourite Weather","words":[["sunny","günəşli"],["windy","küləkli"],["rainy","yağışlı"],["warm","isti, mülayim"],["cold","soyuq"],["go for a walk","gəzintiyə çıxmaq"],["umbrella","çətir"],["in the countryside","kənddə"]],"skel":["Paragraph 1: My favourite weather is ... because ... .","Paragraph 2: When it is ..., I ... . I can ... with my family/friends.","Paragraph 3: However, I do not like ... weather because ... . In conclusion, ... ."],"az":"Mənim ən sevimli havam günəşli və mülayim havadır. Belə havada mən kənddə gəzintiyə çıxıram. Dostlarımla futbol oynayıram. Lakin mən soyuq və yağışlı havanı sevmirəm, çünki evdə qalmalıyam. Nəticə olaraq, günəşli hava ən yaxşısıdır.","en":"My favourite weather is sunny and warm weather. In such weather I go for a walk in the countryside. I play football with my friends. However, I do not like cold and rainy weather because I have to stay at home. In conclusion, sunny weather is the best.","kw":["favourite","sunny","warm","countryside","walk","football","however","cold","rainy","conclusion"]},"3":{"topic":"A Story I Like","words":[["fairy tale","nağıl"],["character","personaj"],["brave","cəsur"],["terrified","dəhşətə gəlmiş"],["trick","aldatmaq"],["moral","dərs, ibrət"],["at the end","sonda"],["once upon a time","biri var idi, biri yox idi"]],"skel":["Paragraph 1: My favourite story is ... It is a ... .","Paragraph 2: Once upon a time ... . Then ... . At the end ... .","Paragraph 3: The moral of the story is ... . In my opinion, ... ."],"az":"Mənim sevimli hekayəm Qırmızı papaqlı qızdır. Biri var idi, biri yox idi, bir qız nənəsinin evinə gedirdi. Yolda canavar onu aldatdı. Sonda ovçu qızı xilas etdi. Hekayənin dərsi budur: yadlara etibar etmə. Mənim fikrimcə, bu çox maraqlı nağıldır.","en":"My favourite story is Little Red Riding Hood. Once upon a time a girl was going to her grandmother's house. On the way a wolf tricked her. At the end a hunter saved the girl. The moral of the story is: do not trust strangers. In my opinion, it is a very interesting fairy tale.","kw":["favourite","story","once upon a time","girl","wolf","tricked","at the end","moral","trust","opinion"]},"4":{"topic":"How I Spend My Money","words":[["pocket money","cib xərci"],["save","yığmaq"],["spend","xərcləmək"],["buy","almaq"],["afford","imkanı olmaq"],["in my opinion","mənim fikrimcə"],["first of all","ilk növbədə"],["charity","xeyriyyə"]],"skel":["Paragraph 1: I get ... pocket money every week. First of all, I ... .","Paragraph 2: I spend money on ... . I also save ... because ... .","Paragraph 3: In my opinion, ... . In conclusion, ... ."],"az":"Mən hər həftə cib xərcliyi alıram. İlk növbədə, onun bir hissəsini yığıram. Qalan pulu kitablara və qəlyanaltıya xərcləyirəm. Mənim fikrimcə, pula qənaət etmək yaxşı vərdişdir. Bəzən mən xeyriyyəyə də kömək edirəm. Nəticə olaraq, pulu ağıllı xərcləmək vacibdir.","en":"I get pocket money every week. First of all, I save a part of it. I spend the rest on books and snacks. In my opinion, saving money is a good habit. Sometimes I also help a charity. In conclusion, it is important to spend money wisely.","kw":["pocket money","every week","first of all","save","spend","books","opinion","habit","charity","conclusion"]},"5":{"topic":"My Dream House","words":[["living room","qonaq otağı"],["bedroom","yataq otağı"],["garden","bağça, həyət"],["big enough","kifayət qədər böyük"],["comfortable","rahat"],["next to","yanında"],["there is / there are","var"],["I would like","istərdim"]],"skel":["Paragraph 1: My dream house is ... It is in/near ... .","Paragraph 2: There is/are ... . The ... is next to the ... . It is big enough for ... .","Paragraph 3: I would like to live there because ... ."],"az":"Mənim xəyal evim dənizin yaxınlığındadır. Orada böyük qonaq otağı və üç yataq otağı var. Evin yanında gözəl bağça var. Mətbəx ailəmiz üçün kifayət qədər böyükdür. Mən orada yaşamaq istərdim, çünki o, çox rahat və gözəldir.","en":"My dream house is near the sea. There is a big living room and three bedrooms. There is a beautiful garden next to the house. The kitchen is big enough for our family. I would like to live there because it is very comfortable and beautiful.","kw":["dream house","near","sea","living room","bedrooms","garden","next to","big enough","would like","comfortable"]},"6":{"topic":"Staying Safe","words":[["safe","təhlükəsiz"],["careful","diqqətli"],["avoid","qaçmaq, çəkinmək"],["make sure","əmin olmaq"],["dangerous","təhlükəli"],["first aid","ilk yardım"],["you should / you must","etməlisən"],["accident","qəza"]],"skel":["Paragraph 1: It is important to stay safe at ... because ... .","Paragraph 2: First, you should ... . Second, you must ... . Never ... .","Paragraph 3: In conclusion, if we are careful, ... ."],"az":"Küçədə təhlükəsiz olmaq çox vacibdir, çünki qəzalar tez baş verə bilər. Birincisi, yolu keçməzdən əvvəl hər iki tərəfə baxmalısan. İkincisi, təhlükəli yerlərdən uzaq durmalısan. Heç vaxt tək üzməməlisən. Nəticə olaraq, əgər diqqətli olsaq, təhlükəsiz qalarıq.","en":"It is important to stay safe on the street because accidents can happen quickly. First, you should look both ways before you cross the road. Second, you must avoid dangerous places. Never swim alone. In conclusion, if we are careful, we will stay safe.","kw":["important","safe","accidents","first","should","look","cross","avoid","dangerous","careful"]},"7":{"topic":"Technology in My Life","words":[["smartphone","smartfon"],["download an app","tətbiq yükləmək"],["video chat","video söhbət"],["social media","sosial media"],["screen","ekran"],["too much","çox artıq"],["communicate","ünsiyyət qurmaq"],["in the future","gələcəkdə"]],"skel":["Paragraph 1: I use ... every day. I use it for ... .","Paragraph 2: I download ... and I chat with ... . However, using it too much ... .","Paragraph 3: In the future, I think ... . In conclusion, ... ."],"az":"Mən hər gün smartfondan istifadə edirəm. Mən ondan dostlarımla yazışmaq və dərs hazırlamaq üçün istifadə edirəm. Bəzən babam və nənəmlə video söhbət edirəm. Lakin telefondan çox istifadə etmək yaxşı deyil. Gələcəkdə texnologiya daha da inkişaf edəcək.","en":"I use a smartphone every day. I use it to chat with my friends and to prepare my lessons. Sometimes I have a video chat with my grandparents. However, using the phone too much is not good. In the future, technology will develop even more.","kw":["smartphone","every day","chat","friends","lessons","video chat","grandparents","however","too much","future"]},"8":{"topic":"A Successful Person I Admire","words":[["admire","heyran olmaq"],["talented","istedadlı"],["determination","qətiyyət"],["hard-working","zəhmətkeş"],["never give up","heç vaxt əl çəkmə"],["achieve","nail olmaq"],["dream","arzu"],["look up to","nümunə götürmək"]],"skel":["Paragraph 1: The person I admire most is ... He/She is a ... .","Paragraph 2: He/She is talented and ... . He/She never gives up. He/She achieved ... .","Paragraph 3: I look up to ... because ... . In conclusion, ... ."],"az":"Ən çox heyran olduğum şəxs mənim müəllimimdir. O, çox istedadlı və zəhmətkeş insandır. O, heç vaxt əl çəkmir və hər zaman bizə kömək edir. Mən ona baxıb nümunə götürürəm, çünki o, öz arzusuna çatdı. Nəticə olaraq, qətiyyət uğurun əsasıdır.","en":"The person I admire most is my teacher. She is a very talented and hard-working person. She never gives up and always helps us. I look up to her because she achieved her dream. In conclusion, determination is the key to success.","kw":["admire","teacher","talented","hard-working","never gives up","helps","look up to","achieved","dream","determination"]},"9":{"topic":"My Favourite Music or Dance","words":[["listen to music","musiqi dinləmək"],["play the guitar","gitara çalmaq"],["rock / pop / classical","rok / pop / klassik"],["concert","konsert"],["dance","rəqs etmək"],["amazing","heyrətamiz"],["relax","dincəlmək"],["all in all","ümumilikdə"]],"skel":["Paragraph 1: My favourite kind of music/dance is ... I like it because ... .","Paragraph 2: I listen to ... / I dance ... . Last month I went to ... . It was ... .","Paragraph 3: All in all, music/dance makes me ... ."],"az":"Mənim ən sevimli musiqi növüm popdur. Mən onu hər gün dinləyirəm, çünki o, məni dincəldir. Keçən ay mən konsertə getdim. Səhnədə gitara çalan oğlan heyrətamiz idi. Mən də gitara çalmağı öyrənmək istəyirəm. Ümumilikdə, musiqi məni çox xoşbəxt edir.","en":"My favourite kind of music is pop. I listen to it every day because it helps me relax. Last month I went to a concert. The boy who played the guitar on the stage was amazing. I also want to learn to play the guitar. All in all, music makes me very happy.","kw":["favourite","music","pop","listen","relax","concert","guitar","amazing","learn","all in all"]}},PICS={"1":{"t":"At the film set","words":[["camera","kamera"],["director's chair","rejissor kreslosu"],["light","işıq"],["clapperboard","kadr taxtası"],["actor","aktyor"],["microphone","mikrofon"],["costume","kostyum"],["set","çəkiliş meydançası"]],"model":"In the picture, I can see a film set. There is a camera on the left and a big light behind it. In the middle, an actor is standing in a costume. There is a director's chair next to the actor. At the bottom, I can see a clapperboard. It looks like they are making a film. I think the actor is nervous. All in all, I like this picture because I love films.","kw":["camera","light","actor","chair","costume","film","director","clapper"]},"2":{"t":"The countryside","words":[["farm","ferma"],["barn","tövlə"],["wagon","araba"],["cow","inək"],["tree","ağac"],["cloud","bulud"],["sun","günəş"],["path","cığır"]],"model":"In the picture, I can see the countryside. There is a red barn on the right and a tree next to it. In the middle, there is a wagon on a path. A cow is standing in front of the barn. At the top, the sun is shining and there are two white clouds. The weather is sunny and warm. It looks like a quiet and beautiful place. I would like to live there.","kw":["barn","tree","wagon","path","cow","sun","cloud","sunny","countryside"]},"3":{"t":"In the park","words":[["bench","skamya"],["ball","top"],["dog","it"],["boy","oğlan"],["girl","qız"],["tree","ağac"],["grass","ot, çəmən"],["sky","səma"]],"model":"In the picture, I can see a park. There is a big tree on the left and a bench under it. A girl is sitting on the bench and she looks bored. In the middle, a boy is playing with a dog. There is a ball on the grass. At the top, the sky is blue. I think the boy is happy but the girl is lonely.","kw":["tree","bench","girl","boy","dog","ball","grass","sky","park"]},"4":{"t":"At the shop","words":[["shop assistant","satıcı"],["customer","müştəri"],["counter","piştaxta"],["cash register","kassa aparatı"],["coin","metal pul"],["bag","çanta"],["price","qiymət"],["shelf","rəf"]],"model":"In the picture, I can see a shop. There is a counter in the middle and a cash register on it. A shop assistant is standing behind the counter. A customer is in front of the counter and she has a bag. On the left there are shelves with things to buy. At the bottom, there are some coins. I think the customer is happy because the prices are low.","kw":["counter","register","assistant","customer","bag","shelves","coins","prices","shop"]},"5":{"t":"The living room","words":[["sofa","divan"],["armchair","kreslo"],["lamp","lampa"],["bookcase","kitab şkafı"],["carpet","xalça"],["window","pəncərə"],["TV","televizor"],["picture","şəkil, tablo"]],"model":"In the picture, I can see a living room. There is a sofa in the middle and an armchair next to it. On the left, there is a bookcase full of books. There is a lamp next to the sofa and a carpet on the floor. A picture is on the wall and a TV is on the right. The window is behind the sofa. It looks comfortable and cosy. I like this room.","kw":["sofa","armchair","bookcase","lamp","carpet","picture","tv","window","living room"]},"6":{"t":"At the beach","words":[["sea","dəniz"],["umbrella","çətir"],["lifeguard","xilasedici"],["boat","qayıq"],["flag","bayraq"],["sand","qum"],["sun","günəş"],["wave","dalğa"]],"model":"In the picture, I can see a beach. The sun is shining at the top and the sea is behind. There is a lifeguard tower on the right with a red flag. In the middle, there is an umbrella on the sand. A boat is on the sea in the background. The weather is hot and sunny. I think it is a safe place because there is a lifeguard. I like swimming here.","kw":["sea","sun","lifeguard","flag","umbrella","sand","boat","sunny","beach"]},"7":{"t":"At the bus stop","words":[["bus","avtobus"],["bus stop","avtobus dayanacağı"],["traffic light","svetofor"],["building","bina"],["passenger","sərnişin"],["smartphone","smartfon"],["road","yol"],["sign","lövhə"]],"model":"In the picture, I can see a street. There is a bus on the road and a bus stop on the left. A passenger is waiting at the stop and he is using a smartphone. There is a traffic light next to the road. In the background, I can see tall buildings. At the top, there is a sign. It looks like a busy morning. I think the passenger is waiting for the bus to school.","kw":["bus","stop","passenger","phone","traffic light","buildings","road","street","waiting"]},"8":{"t":"The winners","words":[["podium","kürsü, podium"],["trophy","kubok"],["medal","medal"],["flag","bayraq"],["winner","qalib"],["athlete","idmançı"],["first place","birinci yer"],["crowd","izdiham, tamaşaçılar"]],"model":"In the picture, I can see three athletes on a podium. The winner is in the middle on the first place and she is holding a trophy. The other athletes are on the left and on the right. They have medals around their necks. At the top, there are flags. I think they are very proud and happy. It looks like an important competition. All in all, success needs hard work.","kw":["podium","trophy","medal","flag","winner","athlete","first place","proud","competition"]},"9":{"t":"On the stage","words":[["stage","səhnə"],["guitar","gitara"],["drums","nağara, baraban"],["microphone","mikrofon"],["singer","müğənni"],["audience","tamaşaçılar"],["spotlight","projektor işığı"],["band","qrup"]],"model":"In the picture, I can see a band on a stage. There is a singer in the middle and she has a microphone. A guitarist is on the left and a drummer is behind them. There are bright lights at the top. In the foreground, I can see the audience. It looks like a rock concert. I think everybody is excited. All in all, it is a must-see show.","kw":["stage","singer","microphone","guitar","drum","lights","audience","band","concert"]}},SPK={"1":["My favourite TV show is a cartoon called Space Kids. I like it because it is funny and exciting.","I prefer watching films at home because it is cheaper and more comfortable. I can also watch with my family.","I would like to be an actor. I want to work on a film set and wear different costumes."],"2":["Life was very different 100 years ago. People travelled in wagons and they did not have phones or computers.","Yesterday it was sunny and warm. I went for a walk with my friends.","I would not like to live in the past because life was difficult. I prefer modern life."],"3":["My favourite story is Little Red Riding Hood. I like it because it teaches us not to trust strangers.","When I am nervous, my hands become cold and my heart beats fast. I try to stay calm.","Fairy tales teach us important morals. For example, we should be kind and honest."],"4":["I spend my pocket money on books and snacks. I also save some money every week.","In my opinion, doctors are the most important because they save lives. Firefighters are important, too.","We can help people by donating old clothes and by being kind to our neighbours."],"5":["My favourite room is my bedroom because it is cosy. There is a bed, a desk and a big window.","At home I have to do the dishes and make my bed. I don't have to cook.","I would not like to live in a tiny house because it is not big enough for my family."],"6":["If you hurt your knee, you should sit down and put some ice on it. Then ask an adult for help.","There are dangers like strong sun, rip currents and jellyfish. You must be careful.","In the mountains we must wear warm clothes, take water and never walk alone."],"7":["I use apps for chatting with friends and doing homework. My favourite app is a dictionary.","I usually go to school on foot because I live near the school. Sometimes I take the bus.","In the future, I would like to have a flying car. It will be fast and fun."],"8":["I admire my teacher. She is hard-working and she never gives up.","I am good at drawing and maths. I practise every day.","For me, success means to achieve your dreams and to help other people."],"9":["I like pop music because it is energetic. I listen to it when I do my homework.","I cannot play an instrument yet, but I dance with my friends. I want to learn the guitar.","Yes, last month I went to a concert. The band was amazing and everybody sang."]},PHR12=[["In the picture, I can see ...","Şəkildə ... görürəm"
